name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS Simulator app
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew list --versions xcodegen || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project NxNativeMobile.xcodeproj
          -scheme NxNativeMobile
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-ios-simulator
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/NxNative.app
          if-no-files-found: error
          retention-days: 7
