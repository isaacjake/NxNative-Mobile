name: NxNative iOS Compile
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    name: Compile iOS App
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Compile for iPhone
        run: |
          xcodebuild \
            -project NxNativeMobile.xcodeproj \
            -scheme NxNativeMobile \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/NxNativeBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R \
            "$RUNNER_TEMP/NxNativeBuild/Build/Products/Debug-iphoneos/NxNative.app" \
            "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -r "$GITHUB_WORKSPACE/NxNative-unsigned.ipa" Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Unsigned-IPA
          path: NxNative-unsigned.ipa
          if-no-files-found: error
